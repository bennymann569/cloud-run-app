apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: cloud-run-app

manifests:
  kustomize:
    paths:
      - k8s/overlays/dev

profiles:
  - name: dev
    manifests:
      kustomize:
        paths:
          - k8s/overlays/dev
  - name: staging
    manifests:
      kustomize:
        paths:
          - k8s/overlays/staging
  - name: prod
    manifests:
      kustomize:
        paths:
          - k8s/overlays/prod

deploy:
  cloudrun: {}
