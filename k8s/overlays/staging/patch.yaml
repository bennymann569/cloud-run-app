- op: replace
  path: /metadata/name
  value: cloud-run-app-staging
- op: replace
  path: /spec/template/metadata/annotations/autoscaling.knative.dev~1minScale
  value: "1"
- op: add
  path: /spec/template/metadata/annotations/autoscaling.knative.dev~1maxScale
  value: "5"
- op: replace
  path: /spec/template/spec/serviceAccountName
  value: cloud-run-app-staging-runtime
- op: replace
  path: /spec/template/spec/containers/0/env/0/value
  value: staging
